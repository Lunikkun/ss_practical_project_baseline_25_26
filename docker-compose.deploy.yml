services:
  edge:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_healthy
      web2:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  web:
    image: ${WEB_IMAGE}
    expose:
      - "8000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1048576}
      APP_SECURITY_PROFILE: ${APP_SECURITY_PROFILE:-production}
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  web2:
    image: ${WEB_IMAGE}
    expose:
      - "8000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1048576}
      APP_SECURITY_PROFILE: ${APP_SECURITY_PROFILE:-production}
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s

  db:
    image: ${DB_IMAGE}
    environment:
      POSTGRES_DB: ${DB_NAME:-docdb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-docdb}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  pgdata: