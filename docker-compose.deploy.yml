services:
  edge:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: unless-stopped

  web:
    image: ${WEB_IMAGE}
    expose:
      - "8000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1048576}
      APP_SECURITY_PROFILE: ${APP_SECURITY_PROFILE:-production}
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    depends_on:
      - db
    restart: unless-stopped

  web2:
    image: ${WEB_IMAGE}
    expose:
      - "8000"
    environment:
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME}
      SECRET_KEY: ${SECRET_KEY}
      API_KEY: ${API_KEY}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1048576}
      APP_SECURITY_PROFILE: ${APP_SECURITY_PROFILE:-production}
      FORCE_HTTPS: ${FORCE_HTTPS:-1}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-1}
    depends_on:
      - db
    restart: unless-stopped

  db:
    image: ${DB_IMAGE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  pgdata: