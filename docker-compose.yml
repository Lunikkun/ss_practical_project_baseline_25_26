services:
  edge:
    image: nginx:1.27-alpine
    ports:
      - "8000:80"
    volumes:
      - ./edge/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

  web:
    build: ./web
    expose:
      - "8000"
    volumes:
      - ./web:/app
    env_file:
      - .env
    depends_on:
      - db

  db:
    build: ./db
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
