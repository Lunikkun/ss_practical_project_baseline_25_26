upstream flask_app {
    server web:8000;
    keepalive 16;
}

map $request_method $login_limit_key {
    default "";
    POST $binary_remote_addr;
}

limit_req_zone $binary_remote_addr zone=general_zone:10m rate=60r/s;
limit_req_zone $login_limit_key zone=login_zone:10m rate=240r/m;
limit_req_zone $binary_remote_addr zone=upload_zone:10m rate=240r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;
    limit_req_status 429;

    location = /login {
        limit_req zone=login_zone burst=120 nodelay;
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /documents/upload {
        limit_req zone=upload_zone burst=60 nodelay;
        client_max_body_size 10m;
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=general_zone burst=200 nodelay;
        proxy_pass http://flask_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
