name: 2 - Continuous Delivery
run-name: "${{ github.workflow }}"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to validate (e.g., commit SHA)"
        required: true
  workflow_run:
    workflows: ["1 - Continuous Integration"]
    types:
      - completed

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  WEB_IMAGE_NAME: secure-doc-platform-web
  DB_IMAGE_NAME: secure-doc-platform-db

jobs:
  deliver:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set lowercase image namespace
        id: lowercase
        run: |
          echo "namespace=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve image tag
        id: image-tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export deployment image references
        id: image-refs
        run: |
          echo "web_image=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.WEB_IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"
          echo "db_image=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.DB_IMAGE_NAME }}:${{ steps.image-tag.outputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Verify deliverable images exist
        run: |
          docker manifest inspect "${{ steps.image-refs.outputs.web_image }}" > /dev/null || {
            echo "Missing web image: ${{ steps.image-refs.outputs.web_image }}"
            exit 1
          }

          docker manifest inspect "${{ steps.image-refs.outputs.db_image }}" > /dev/null || {
            echo "Missing db image: ${{ steps.image-refs.outputs.db_image }}"
            exit 1
          }

      - name: Pull deliverable images
        run: |
          docker pull "${{ steps.image-refs.outputs.web_image }}"
          docker pull "${{ steps.image-refs.outputs.db_image }}"

      - name: Prepare delivery environment variables
        id: delivery-env
        run: |
          DELIVERY_DB_PASSWORD="delivery-db-$(openssl rand -hex 16)"
          DELIVERY_SECRET_KEY="delivery-secret-$(openssl rand -hex 32)"
          DELIVERY_API_KEY="delivery-api-$(openssl rand -hex 24)"

          echo "db_password=${DELIVERY_DB_PASSWORD}" >> "$GITHUB_OUTPUT"
          echo "secret_key=${DELIVERY_SECRET_KEY}" >> "$GITHUB_OUTPUT"
          echo "api_key=${DELIVERY_API_KEY}" >> "$GITHUB_OUTPUT"

          echo "::add-mask::${DELIVERY_DB_PASSWORD}"
          echo "::add-mask::${DELIVERY_SECRET_KEY}"
          echo "::add-mask::${DELIVERY_API_KEY}"

      - name: Validate delivery compose rendering
        env:
          WEB_IMAGE: ${{ steps.image-refs.outputs.web_image }}
          DB_IMAGE: ${{ steps.image-refs.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.delivery-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.delivery-env.outputs.secret_key }}
          API_KEY: ${{ steps.delivery-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml config > /tmp/delivery-compose-resolved.yml

      - name: Start delivery environment
        env:
          WEB_IMAGE: ${{ steps.image-refs.outputs.web_image }}
          DB_IMAGE: ${{ steps.image-refs.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.delivery-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.delivery-env.outputs.secret_key }}
          API_KEY: ${{ steps.delivery-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml up -d

      - name: Show initial delivery status
        env:
          WEB_IMAGE: ${{ steps.image-refs.outputs.web_image }}
          DB_IMAGE: ${{ steps.image-refs.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.delivery-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.delivery-env.outputs.secret_key }}
          API_KEY: ${{ steps.delivery-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml ps

      - name: Wait for application
        env:
          WEB_IMAGE: ${{ steps.image-refs.outputs.web_image }}
          DB_IMAGE: ${{ steps.image-refs.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.delivery-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.delivery-env.outputs.secret_key }}
          API_KEY: ${{ steps.delivery-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          timeout=180
          elapsed=0

          until curl -fs http://localhost:8000/health > /dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Application did not become ready within ${timeout}s"
              echo "--- compose status ---"
              docker compose -f docker-compose.deploy.yml ps
              echo "--- last logs ---"
              docker compose -f docker-compose.deploy.yml logs --no-color --tail 120 | .github/scripts/redact_ci_logs.sh
              exit 1
            fi

            echo "Waiting for application... (${elapsed}s/${timeout}s)"
            if [ $((elapsed % 20)) -eq 0 ]; then
              docker compose -f docker-compose.deploy.yml ps
            fi
            sleep 5
            elapsed=$((elapsed+5))
          done

          echo "Application is ready"

      - name: Verify application health
        run: |
          curl -f http://localhost:8000/health

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest requests

      - name: Run delivery authentication flow test
        env:
          APP_BASE_URL: http://localhost:8000
        run: |
          pytest -q tests/test_delivery_auth_flow.py

      - name: Promote validated images to dev
        if: success()
        run: |
          docker tag "${{ steps.image-refs.outputs.web_image }}" "${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.WEB_IMAGE_NAME }}:dev"
          docker tag "${{ steps.image-refs.outputs.db_image }}" "${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.DB_IMAGE_NAME }}:dev"

          docker push "${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.WEB_IMAGE_NAME }}:dev"
          docker push "${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.DB_IMAGE_NAME }}:dev"

      - name: Show container logs on failure
        if: failure()
        env:
          WEB_IMAGE: ${{ steps.image-refs.outputs.web_image }}
          DB_IMAGE: ${{ steps.image-refs.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.delivery-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.delivery-env.outputs.secret_key }}
          API_KEY: ${{ steps.delivery-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml logs --no-color --tail 300 | .github/scripts/redact_ci_logs.sh

      - name: Stop delivery environment
        if: always()
        env:
          WEB_IMAGE: ${{ steps.image-refs.outputs.web_image }}
          DB_IMAGE: ${{ steps.image-refs.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.delivery-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.delivery-env.outputs.secret_key }}
          API_KEY: ${{ steps.delivery-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml down -v --remove-orphans