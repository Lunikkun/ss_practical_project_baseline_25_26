name: 3 - Continuous Deployment
run-name: "${{ github.workflow }}"

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g., dev or a specific commit SHA)"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  WEB_IMAGE_NAME: secure-doc-platform-web
  DB_IMAGE_NAME: secure-doc-platform-db

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set lowercase image namespace
        id: lowercase
        run: |
          echo "namespace=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve deployment images
        id: deploy-images
        run: |
          echo "web_image=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.WEB_IMAGE_NAME }}:${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          echo "db_image=${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.DB_IMAGE_NAME }}:${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"

      - name: Show deployment target
        run: |
          echo "Deploying WEB_IMAGE=${{ steps.deploy-images.outputs.web_image }}"
          echo "Deploying DB_IMAGE=${{ steps.deploy-images.outputs.db_image }}"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull deployment images
        run: |
          docker pull "${{ steps.deploy-images.outputs.web_image }}"
          docker pull "${{ steps.deploy-images.outputs.db_image }}"

      - name: Prepare deployment environment
        id: deploy-env
        run: |
          DEPLOY_DB_PASSWORD="deploy-db-$(openssl rand -hex 16)"
          DEPLOY_SECRET_KEY="deploy-secret-$(openssl rand -hex 32)"
          DEPLOY_API_KEY="deploy-api-$(openssl rand -hex 24)"

          echo "db_password=${DEPLOY_DB_PASSWORD}" >> "$GITHUB_OUTPUT"
          echo "secret_key=${DEPLOY_SECRET_KEY}" >> "$GITHUB_OUTPUT"
          echo "api_key=${DEPLOY_API_KEY}" >> "$GITHUB_OUTPUT"

          echo "::add-mask::${DEPLOY_DB_PASSWORD}"
          echo "::add-mask::${DEPLOY_SECRET_KEY}"
          echo "::add-mask::${DEPLOY_API_KEY}"

      - name: Validate deploy compose rendering
        env:
          WEB_IMAGE: ${{ steps.deploy-images.outputs.web_image }}
          DB_IMAGE: ${{ steps.deploy-images.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.deploy-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.deploy-env.outputs.secret_key }}
          API_KEY: ${{ steps.deploy-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml config > /tmp/deploy-compose-resolved.yml

      - name: Start deployment
        env:
          WEB_IMAGE: ${{ steps.deploy-images.outputs.web_image }}
          DB_IMAGE: ${{ steps.deploy-images.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.deploy-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.deploy-env.outputs.secret_key }}
          API_KEY: ${{ steps.deploy-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml up -d

      - name: Show initial deployment status
        env:
          WEB_IMAGE: ${{ steps.deploy-images.outputs.web_image }}
          DB_IMAGE: ${{ steps.deploy-images.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.deploy-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.deploy-env.outputs.secret_key }}
          API_KEY: ${{ steps.deploy-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml ps

      - name: Wait for application
        env:
          WEB_IMAGE: ${{ steps.deploy-images.outputs.web_image }}
          DB_IMAGE: ${{ steps.deploy-images.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.deploy-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.deploy-env.outputs.secret_key }}
          API_KEY: ${{ steps.deploy-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          timeout=180
          elapsed=0

          until curl -fs http://localhost:8000/health > /dev/null; do
            if [ "$elapsed" -ge "$timeout" ]; then
              echo "Application did not become ready within ${timeout}s"
              echo "--- compose status ---"
              docker compose -f docker-compose.deploy.yml ps
              echo "--- last logs ---"
              docker compose -f docker-compose.deploy.yml logs --no-color --tail 120 | .github/scripts/redact_ci_logs.sh
              exit 1
            fi

            echo "Waiting for application... (${elapsed}s/${timeout}s)"
            if [ $((elapsed % 20)) -eq 0 ]; then
              docker compose -f docker-compose.deploy.yml ps
            fi
            sleep 5
            elapsed=$((elapsed+5))
          done

          echo "Application is ready"

      - name: Verify deployment health
        run: |
          curl -f http://localhost:8000/health

      - name: Promote deployed images to prod
        if: success()
        run: |
          docker tag "${{ steps.deploy-images.outputs.web_image }}" "${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.WEB_IMAGE_NAME }}:prod"
          docker tag "${{ steps.deploy-images.outputs.db_image }}" "${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.DB_IMAGE_NAME }}:prod"

          docker push "${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.WEB_IMAGE_NAME }}:prod"
          docker push "${{ env.REGISTRY }}/${{ steps.lowercase.outputs.namespace }}/${{ env.DB_IMAGE_NAME }}:prod"

      - name: Show deployed container status on failure
        if: failure()
        env:
          WEB_IMAGE: ${{ steps.deploy-images.outputs.web_image }}
          DB_IMAGE: ${{ steps.deploy-images.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.deploy-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.deploy-env.outputs.secret_key }}
          API_KEY: ${{ steps.deploy-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml ps

      - name: Show container logs on failure
        if: failure()
        env:
          WEB_IMAGE: ${{ steps.deploy-images.outputs.web_image }}
          DB_IMAGE: ${{ steps.deploy-images.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.deploy-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.deploy-env.outputs.secret_key }}
          API_KEY: ${{ steps.deploy-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml logs --no-color --tail 300 | .github/scripts/redact_ci_logs.sh

      - name: Teardown deployment
        if: always()
        env:
          WEB_IMAGE: ${{ steps.deploy-images.outputs.web_image }}
          DB_IMAGE: ${{ steps.deploy-images.outputs.db_image }}
          DB_USER: postgres
          DB_PASSWORD: ${{ steps.deploy-env.outputs.db_password }}
          DB_NAME: docdb
          DB_HOST: db
          DB_PORT: "5432"
          SECRET_KEY: ${{ steps.deploy-env.outputs.secret_key }}
          API_KEY: ${{ steps.deploy-env.outputs.api_key }}
          APP_BASE_URL: http://localhost:8000
          MAX_UPLOAD_BYTES: "1048576"
          APP_SECURITY_PROFILE: dev
          FORCE_HTTPS: "0"
          SESSION_COOKIE_SECURE: "0"
        run: |
          docker compose -f docker-compose.deploy.yml down -v || true